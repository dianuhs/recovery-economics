name: PR Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run black --check recovery_economics tests
      - run: uv run isort --check-only recovery_economics tests
      - run: uv run flake8 recovery_economics tests --count --select=E9,F63,F7,F82,F401 --show-source --statistics
      - run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file /tmp/runtime-requirements.txt
          uv run pip-audit --cache-dir /tmp/pip-audit-cache --requirement /tmp/runtime-requirements.txt

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run pytest -q
      - name: Validate CCAC 1.1 with released reference package
        env:
          CCAC_WHEEL_URL: https://github.com/cloudandcapital/cloud-capital-analysis-contract/releases/download/v0.2.0/cloudandcapital_ccac-0.2.0-py3-none-any.whl
          CCAC_WHEEL_SHA256: bc46f363b1a03c94cf0da75759bccd0271de2c53b1f77a1a7255f9c8e7f768f1
        run: |
          curl --fail --location --silent --show-error "$CCAC_WHEEL_URL" --output /tmp/cloudandcapital_ccac-0.2.0-py3-none-any.whl
          echo "$CCAC_WHEEL_SHA256  /tmp/cloudandcapital_ccac-0.2.0-py3-none-any.whl" | sha256sum --check --strict
          uv pip install --python .venv/bin/python /tmp/cloudandcapital_ccac-0.2.0-py3-none-any.whl
          uv run recovery-economics ccac --demo --contract-version 1.1.0 --output /tmp/recovery-1.1.json
          uv run ccac validate /tmp/recovery-1.1.json

  package:
    name: Package smoke test
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv build --out-dir dist
      - run: |
          python -m venv package-smoke
          uv pip install --python package-smoke/bin/python dist/*.whl
          package-smoke/bin/recovery-economics --version
      - run: |
          package-smoke/bin/recovery-economics ccac --demo > demo-1.json
          package-smoke/bin/recovery-economics ccac --demo > demo-2.json
          cmp demo-1.json demo-2.json
          package-smoke/bin/recovery-economics ccac --demo --contract-version 1.0.0 > demo-explicit-1.0.json
          cmp demo-1.json demo-explicit-1.0.json
          package-smoke/bin/recovery-economics ccac --demo --contract-version 1.1.0 > demo-1.1.json
